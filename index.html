function potionBtn(inCombat, canAct = true) {
  const h = H_();
  const full = h.hp >= heroMaxHp();
  return `<button class="btn" data-act="potion" type="button" ${busy || !canAct || h.potions <= 0 || full || h.down ? "disabled" : ""}>Potion ×${h.potions}<small>Heal 2d6 + ${4 + (perkCount("potion") ? 5 : 0)}${inCombat ? ", uses your turn" : ""}</small></button>`;
}

// Whose combat turn the viewer may take: their own, or (host only) an offline partner's.
function myCombatSeat() {
  const c = state.combat; if (!c) return -1;
  if (c.turn === me()) return me();
  if (net.role === "host" && !net.peerOnline && c.turn === 1) return 1;
  return -1;
}

function renderAction() {
  const h = H_(), c = CLASSES[h.cls];
  const p = h.panel;
  if (p && p.kind === "perk") {
    return `<div class="panel act"><div class="eyebrow">${p.miracle ? "The shrine's gift" : `Level ${h.lvl}`}</div><h3>Choose a gift</h3>
      <div class="choices">${p.options.map(id => { const x = PERKS.find(q => q.id === id); return `<button class="choice" data-perk="${id}" type="button"><b>${x.name}</b><span>${x.text}</span></button>`; }).join("")}</div></div>`;
  }
  if (p && p.kind === "loot") {
    const it = p.item, cur = h[it.kind];
    const better = itemScore(it) > itemScore(cur);
    return `<div class="panel act"><div class="eyebrow">Loot · ${RARITY[it.rarity]} ${it.kind}</div><h3 class="r${it.rarity}">${esc(it.name)}</h3>
      <div class="item-card"><div class="nm r${it.rarity}">${esc(it.name)}</div><div class="d">${itemDesc(it)}</div></div>
      <div class="item-card"><div class="d">You have now</div><div class="nm ${cur ? "r" + cur.rarity : ""}">${cur ? esc(cur.name) : "Nothing"}</div><div class="d">${itemDesc(cur)}</div></div>
      <div class="btns"><button class="btn ${better ? "primary" : ""}" data-act="equip" type="button">Equip${better ? " (upgrade)" : ""}</button><button class="btn ${better ? "" : "primary"}" data-act="sell" type="button">Sell for ${Math.round(sellPrice(it) * goldMult())} gold</button></div></div>`;
  }
  if (state.combat) {
    const e = state.combat.enemy;
    const seat = myCombatSeat();
    // When covering for an offline partner, show their buttons and numbers.
    if (seat >= 0 && seat !== me()) { const saved = actor; actor = seat; try { return renderCombat(e, true, true); } finally { actor = saved; } }
    return renderCombat(e, seat >= 0, false);
  }
  const r = curRoom();
  let title = "Quiet room", text = r.flavor || "", btns = "";
  if (r.type === "start") { title = state.map.depth === 1 ? "The Crypt Mouth" : "Bottom of the stairs"; text = "Torchlight behind you, darkness ahead. Pick a direction."; }
  if (r.type === "chest") { title = r.cleared ? "Empty chest" : "A dusty chest"; text = r.cleared ? "Nothing left but splinters." : "It might be trapped. It might be full of gold. Only one way to know."; if (!r.cleared) btns += `<button class="btn primary" data-act="chest" type="button" ${busy ? "disabled" : ""}>Open the chest</button>`; }
  if (r.type === "shrine") { title = "Humming shrine"; text = r.cleared ? "The stone has gone quiet." : "Roll a d20 and pray. Low rolls hurt. High rolls bless. A 20 grants a gift."; if (!r.cleared) btns += `<button class="btn primary" data-act="pray" type="button" ${busy ? "disabled" : ""}>Pray (roll d20)</button>`; }
  if (r.type === "camp") { title = "Old campfire"; text = r.cleared ? "Cold ash now." : `Rest here to recover 60% HP and one ability charge${state.coop ? " (both of you)" : ""}. Only once.`; if (!r.cleared) btns += `<button class="btn primary" data-act="rest" type="button" ${busy ? "disabled" : ""}>Rest</button>`; }
  if (r.type === "trap") { title = "Sprung trap"; text = "Spent darts and a cracked pressure plate."; }
  if (r.type === "monster") { title = "Battleground"; text = "Bones and scorch marks. Nothing moves here now."; }
  if (r.type === "merchant") {
    const pr = shopPrices();
    title = "The lantern peddler"; text = `"Everything's for sale, and nothing's refundable." You have ${h.gold} gold.`;
    btns += `<button class="btn" data-act="buy-potion" type="button" ${busy || h.gold < pr.potion ? "disabled" : ""}>Potion<small>${pr.potion} gold</small></button>`;
    btns += `<button class="btn" data-act="buy-charge" type="button" ${busy || h.gold < pr.charge || h.charges >= heroMaxCharges() ? "disabled" : ""}>+1 charge<small>${pr.charge} gold</small></button>`;
    btns += `<button class="btn" data-act="buy-gear" type="button" ${busy || h.gold < pr.gear ? "disabled" : ""}>Wrapped bundle<small>${pr.gear} gold, Fine or better</small></button>`;
  }
  const hold = panelHold();
  if (r.type === "stairs") { title = r.boss ? `${r.boss.name} lies still` : "Spiral stairs"; text = `Down to floor ${state.map.depth + 1}. Your abilities refresh when you descend.`; btns += `<button class="btn primary" data-act="descend" type="button" ${busy || hold ? "disabled" : ""}>Descend${state.coop ? " together" : ""}</button>`; }
  btns += potionBtn(false);
  if (h.cls === "wardsinger") btns += `<button class="btn" data-act="ability" type="button" ${busy || h.charges <= 0 || !heroes().some(x => x.hp < heroMaxHp(x)) ? "disabled" : ""}>Mending Hymn<small>${h.charges} left${state.coop ? ", heals both" : ""}</small></button>`;
  const waitNote = hold && !h.panel ? `<p style="color:var(--torch)">Waiting for ${esc(partnerName())} to finish choosing before the party moves on.</p>` : "";
  return `<div class="panel act"><div class="eyebrow">Floor ${state.map.depth} · Exploring</div><h3>${esc(title)}</h3><p>${esc(text)}</p>${waitNote}<div class="btns">${btns}</div>
    <div class="dpad" aria-label="Move"><button class="u" data-dir="n" type="button" aria-label="North">↑</button><button class="l" data-dir="w" type="button" aria-label="West">←</button><button class="d" data-dir="s" type="button" aria-label="South">↓</button><button class="r" data-dir="e" type="button" aria-label="East">→</button></div></div>`;
}

function renderCombat(e, canAct, covering) {
  const h = H_(), c = CLASSES[h.cls];
  const abilityOk = h.charges > 0 && !(h.cls === "ironclad" && h.surge) && !(h.cls === "shade" && h.shadow) && !(h.cls === "wardsinger" && !heroes().some(x => x.down || x.hp < heroMaxHp(x)));
  const off = busy || !canAct || h.down;
  let turnNote = "";
  if (state.coop) {
    const t = state.combat.turn;
    turnNote = h.down && !covering ? `<p class="turn bad">You're down. ${esc(partnerName())} has to win this fight to get you back up.</p>`
      : covering ? `<p class="turn">${esc(heroName(h))} is offline, so you're taking their turn.</p>`
      : busy ? `<p class="turn">Rolling…</p>`
      : canAct ? `<p class="turn good">Your turn!</p>`
      : `<p class="turn">${esc(heroName(state.heroes[t] || h))}'s turn…</p>`;
  }
  return `<div class="panel act"><div class="eyebrow">${e.boss ? "Boss fight" : "Combat"} · Round ${state.combat.round}</div>
      <div class="foe"><div class="sig">${esc(e.sig)}</div><div class="meta"><div class="nm">${esc(e.name)}</div><div class="sub">Guard ${e.guard} · Hit +${e.atk} · d${e.die}</div>
      <div class="bar enemy"><i style="width:${clamp(e.hp / e.maxHp * 100, 0, 100)}%"></i></div><div class="barlab"><span>HP ${Math.max(0, e.hp)} / ${e.maxHp}</span></div></div></div>
      ${turnNote}
      <div class="btns">
        <button class="btn primary" data-act="attack" type="button" ${off ? "disabled" : ""}>Attack<small>d20 + ${heroAtk()} vs ${e.guard}</small></button>
        <button class="btn" data-act="ability" type="button" ${off || !abilityOk ? "disabled" : ""}>${c.ability.name}<small>${h.charges} left</small></button>
        ${potionBtn(true, !off)}
        <button class="btn danger" data-act="flee" type="button" ${off ? "disabled" : ""}>Flee<small>d20 to escape${state.coop ? ", together" : ""}</small></button>
      </div>
      <p style="margin-top:10px;font-size:.85rem">${c.ability.desc}${state.coop && h.cls === "wardsinger" ? " Your partner heals half as much, and gets back up if they're down." : ""}</p></div>`;
}

function logLine(l) {
  const tag = state.coop && typeof l.who === "number" && state.heroes[l.who] ? `<b class="who w${l.who === me() ? "me" : "them"}">${esc(heroName(state.heroes[l.who]))}</b> ` : "";
  return `<div class="${l.tone}">${tag}${esc(l.msg)}</div>`;
}

function renderPlay() {
  const h = H_();
  const scroll = document.querySelector(".log") ? document.querySelector(".log").scrollTop : 0;
  const quit = net.role === "guest" ? `<button class="linkbtn" id="leave" type="button">Leave room</button>`
    : `<button class="linkbtn" id="abandon" type="button">${state.confirmQuit ? "Really give up? Click again" : state.coop ? "Give up run (both)" : "Give up run"}</button>${net.role ? `<button class="linkbtn" id="leave" type="button">Leave room</button>` : ""}`;
  app.innerHTML = `
  ${banner()}
  <header class="top">
    <div class="brand">Crypts &amp; Coins<small>${state.coop ? `Room ${esc(state.code || net.code || "")}` : `Floor ${state.map.depth}`}</small></div>
    <div class="hud"><span>Floor <b>${state.map.depth}</b></span><span class="g">Gold <b>${h.gold}</b></span><span>Foes <b>${h.kills}</b></span>${quit}</div>
  </header>
  <div class="game">
    <div class="col-map panel">
      <div class="map-head"><h2>Floor ${state.map.depth}</h2><span class="hint">${state.map.depth % 3 === 0 ? "A boss guards the stairs" : `Boss on floor ${Math.ceil(state.map.depth / 3) * 3}`}</span></div>
      ${renderMap()}
      <div class="legend"><span><b>@</b>${state.coop ? "your party" : "you"}</span><span><b class="bad">x</b>foe</span><span><b class="goldc">$</b>chest</span><span><b class="magic">+</b>shrine</span><span><b style="color:var(--verdigris)">M</b>peddler</span><span><b class="crit">*</b>campfire</span><span><b>&gt;</b>stairs</span><span><b>?</b>unexplored</span></div>
    </div>
    <div class="col-tray panel"><div class="tray" id="tray"></div></div>
    <div class="col-side">
      ${renderAction()}
      ${renderSheet()}
      ${state.coop ? renderPartner() : ""}
      <div class="panel logpanel"><div class="eyebrow">Chronicle</div><div class="log">${state.log.map(logLine).join("")}</div></div>
    </div>
  </div>`;
  renderTray();
  const lg = document.querySelector(".log"); if (lg) lg.scrollTop = scroll;
  app.querySelectorAll("[data-x]").forEach(b => b.addEventListener("click", () => act("move", +b.dataset.x, +b.dataset.y)));
  app.querySelectorAll("[data-dir]").forEach(b => b.addEventListener("click", () => act("dir", b.dataset.dir)));
  app.querySelectorAll("[data-perk]").forEach(b => b.addEventListener("click", () => act("perk", b.dataset.perk)));
  const acts = { attack: ["attack"], ability: ["ability"], potion: ["potion"], flee: ["flee"], chest: ["chest"], pray: ["pray"], rest: ["rest"], descend: ["descend"], equip: ["equip"], sell: ["sell"], "buy-potion": ["buy", "potion"], "buy-charge": ["buy", "charge"], "buy-gear": ["buy", "gear"] };
  app.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => act(...acts[b.dataset.act])));
  const ab = document.getElementById("abandon");
  if (ab) ab.addEventListener("click", () => {
    if (busy) return;
    if (!state.confirmQuit) { state.confirmQuit = true; render(); setTimeout(() => { if (state && state.confirmQuit) { state.confirmQuit = false; render(); } }, 3000); return; }
    state.confirmQuit = false; die("giving up");
  });
  const lv = document.getElementById("leave"); if (lv) lv.addEventListener("click", () => netLeave());
}

/* ---------------- Actions (local or over the network) ---------------- */
const ACTIONS = {
  move: (x, y) => moveTo(x, y), dir: (d) => tryDir(d), attack, ability: useAbility, potion: drinkPotion, flee,
  chest: openChest, pray, rest, descend, equip: equipLoot, sell: sellLoot, perk: (id) => choosePerk(id), buy: (w) => buy(w),
};
const COMBAT_ACTS = ["attack", "ability", "potion", "flee"];
const PANEL_ACTS = ["equip", "sell", "perk"];

// The viewer pressed something. Solo and host run it here; the partner sends it to the host.
function act(name, ...args) {
  if (net.role === "guest") { netSend({ t: "relay", data: { t: "act", name, args } }); return; }
  runAction(me(), name, args);
}

// Run player `p`'s action on the host (or in solo), if it's allowed right now.
function runAction(p, name, args = []) {
  if (!state) return;
  if (state.screen === "lobby") {
    if (name === "pick" && CLASSES[args[0]]) { state.picks[p] = args[0]; render(); }
    if (name === "start" && p === 0 && state.picks[0] && state.picks[1]) newCoopRun(state.picks.slice(), state.names.map((n, i) => n || `Player ${i + 1}`));
    return;
  }
  if (state.screen === "dead") {
    if (name === "again" && p === 0 && state.coop) { lastRoll = null; state = { screen: "lobby", coop: true, code: state.code, picks: [null, null], names: state.names || [net.name, net.peerName] }; render(); }
    return;
  }
  if (state.screen !== "play" || busy || !ACTIONS[name]) return;
  const h = state.heroes[p]; if (!h) return;
  if (state.combat) {
    if (!COMBAT_ACTS.includes(name)) return;
    const t = state.combat.turn;
    const covering = p === 0 && state.coop && !net.peerOnline && t === 1;
    if (t !== p && !covering) return;
    p = t;
  } else {
    if (COMBAT_ACTS.includes(name) && name !== "potion" && name !== "ability") return;
    if (h.panel && !PANEL_ACTS.includes(name)) return;
    if (!h.panel && PANEL_ACTS.includes(name)) return;
  }
  actor = p;
  ACTIONS[name](...args);
}

document.addEventListener("keydown", (ev) => {
  if (!state || state.screen !== "play") return;
  if (ev.target && /input|textarea/i.test(ev.target.tagName)) return;
  const map = { ArrowUp: "n", KeyW: "n", ArrowDown: "s", KeyS: "s", ArrowLeft: "w", KeyA: "w", ArrowRight: "e", KeyD: "e" };
  if (map[ev.code] && !state.combat && !panelHold()) { ev.preventDefault(); act("dir", map[ev.code]); return; }
  if (state.combat && !busy) {
    if (ev.code === "Space" || ev.code === "Enter" || ev.code === "Digit1") { ev.preventDefault(); act("attack"); }
    else if (ev.code === "Digit2") act("ability");
    else if (ev.code === "Digit3") act("potion");
    else if (ev.code === "Digit4") act("flee");
  }
});

/* ---------------- Co-op networking ----------------
   The room server only passes messages along. The host's browser runs the dungeon
   and sends the whole game state to the partner after every change; the partner
   sends button presses back. */
// Where the room server lives when the game is opened from the plain static site.
const ROOM_SERVER_FALLBACK = "wss://crypts-and-coins-coop.onrender.com/ws";
const net = { role: null, ws: null, code: null, token: null, name: "", peerName: "", connected: false, everConnected: false, peerOnline: false, guestJoined: false, msg: "", hello: null, closing: false, retries: 0, retryTimer: null, pingTimer: null, syncTimer: null };
function me() { return net.role === "guest" ? 1 : 0; }

function roomServerUrl() {
  const q = new URLSearchParams(location.search).get("server");
  if (q) return q;
  const m = document.querySelector('meta[name="cc-room-server"]');
  if (m) return m.content === "same" ? (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws" : m.content;
  if (/\.onrender\.com$/.test(location.hostname)) return ROOM_SERVER_FALLBACK;
  return null;
}
function loadName() { try { return localStorage.getItem("cc-name") || ""; } catch (e) { return ""; } }
function saveName(n) { try { localStorage.setItem("cc-name", n); } catch (e) {} }

function netSaveSession() {
  try {
    if (!net.role || !net.token) { sessionStorage.removeItem("cc-net"); return; }
    sessionStorage.setItem("cc-net", JSON.stringify({ role: net.role, code: net.code, token: net.token, name: net.name, peerName: net.peerName, guestJoined: net.guestJoined, state: net.role === "host" ? state : null }));
  } catch (e) {}
}
function netLoadSession() { try { return JSON.parse(sessionStorage.getItem("cc-net") || "null"); } catch (e) { return null; } }

function netCreate(name) {
  netReset();
  net.role = "host"; net.name = name || "Player 1"; net.msg = "";
  net.hello = { t: "create", name: net.name };
  netOpen(); render();
}
function netJoin(code, name) {
  netReset();
  net.role = "guest"; net.name = name || "Player 2"; net.code = code; net.msg = "";
  net.hello = { t: "join", code, name: net.name };
  state = { screen: "title" };
  netOpen(); render();
}
function netLeave() {
  netSend({ t: "leave" });
  netReset();
  state = { screen: "title" }; lastRoll = null; busy = false;
  render();
}
function netReset(msg) {
  net.closing = true;
  clearTimeout(net.retryTimer); clearInterval(net.pingTimer); clearTimeout(net.syncTimer);
  if (net.ws) { try { net.ws.close(); } catch (e) {} }
  Object.assign(net, { role: null, ws: null, code: null, token: null, peerName: "", connected: false, everConnected: false, peerOnline: false, guestJoined: false, hello: null, retries: 0, firstTry: 0, msg: msg || "" });
  try { sessionStorage.removeItem("cc-net"); } catch (e) {}
}
function netSend(m) { if (net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify(m)); }

function netOpen() {
  const url = roomServerUrl();
  if (!url || !net.role) return;
  net.closing = false;
  if (!net.firstTry) net.firstTry = Date.now();
  let ws;
  try { ws = new WebSocket(url); } catch (e) { netRetry(); return; }
  net.ws = ws;
  ws.onopen = () => {
    if (net.ws !== ws) return;
    net.connected = true; net.everConnected = true; net.retries = 0;
    netSend(net.hello);
    clearInterval(net.pingTimer);
    net.pingTimer = setInterval(() => netSend({ t: "ping" }), 25000);
  };
  ws.onmessage = (ev) => { if (net.ws !== ws) return; let m; try { m = JSON.parse(ev.data); } catch (e) { return; } netHandle(m); };
  ws.onclose = () => {
    if (net.ws !== ws) return;
    net.connected = false; clearInterval(net.pingTimer);
    if (!net.closing && net.role) { netRetry(); render(); }
  };
}
function netRetry() {
  clearTimeout(net.retryTimer);
  // A brand-new room that still can't reach the server after 2 minutes: stop and say so.
  if (!net.everConnected && net.hello && net.hello.t !== "resume" && net.firstTry && Date.now() - net.firstTry > 120000) {
    netReset("Couldn't reach the room server. It may not be set up yet, or it's down. Try again in a minute.");
    state = { screen: "title" }; render(); return;
  }
  const wait = Math.min(8000, 1000 * 2 ** net.retries++);
  net.retryTimer = setTimeout(netOpen, wait);
}

function netHandle(m) {
  if (m.t === "created") {
    net.code = m.code; net.token = m.token; net.hello = { t: "resume", code: m.code, token: m.token };
    actor = 0; lastRoll = null; busy = false;
    state = { screen: "lobby", coop: true, code: m.code, picks: [null, null], names: [net.name, ""] };
    netSaveSession(); render(); return;
  }
  if (m.t === "joined") {
    net.code = m.code; net.token = m.token; net.hello = { t: "resume", code: m.code, token: m.token };
    net.peerOnline = !!m.peerOnline; state = null; lastRoll = null;
    netSaveSession(); render(); return;
  }
  if (m.t === "resumed") {
    net.peerOnline = !!m.peerOnline; net.guestJoined = !!m.guestJoined; if (m.peerName) net.peerName = m.peerName;
    netSyncNow(); render(); return;
  }
  if (m.t === "peer") {
    net.peerOnline = !!m.online;
    if (m.name) net.peerName = m.name;
    if (net.role === "host") {
      if (m.online) {
        net.guestJoined = true;
        if (state && state.screen === "lobby" && m.name) state.names[1] = m.name;
        netSyncNow();
      } else if (m.left) {
        net.guestJoined = false;
        if (state && state.screen === "lobby") { state.names[1] = ""; state.picks[1] = null; }
        else if (state && state.coop) log(`${partnerName()} left the room. You can keep playing both heroes.`, "bad", null);
      }
      netSaveSession();
    }
    render(); return;
  }
  if (m.t === "closed") { netReset(`${partnerName()} closed the room.`); state = { screen: "title" }; lastRoll = null; busy = false; render(); return; }
  if (m.t === "error") {
    const keepState = net.role === "host" && state && state.screen === "play" && m.why === "gone";
    if (keepState) {
      // The room expired but the host still has the run: keep playing it as a local game.
      const s = state; netReset(m.msg); state = s; state.code = ""; render(); return;
    }
    netReset(m.msg); state = { screen: "title" }; lastRoll = null; busy = false; render(); return;
  }
  if (m.t === "relay" && m.data) {
    const d = m.data;
    if (net.role === "guest" && d.t === "state") {
      const before = state && state.heroes && state.heroes[1] ? state.heroes[1].hp : null;
      state = d.state; lastRoll = d.lastRoll; busy = !!d.busy;
      render();
      const after = state && state.heroes && state.heroes[1] ? state.heroes[1].hp : null;
      if (before !== null && after !== null && after < before) flashSheet();
      return;
    }
    if (net.role === "host" && d.t === "act" && typeof d.name === "string") { runAction(1, d.name, Array.isArray(d.args) ? d.args : []); return; }
  }
}

// Host: send the partner the latest state soon (many renders in a row become one message).
function netSyncSoon() {
  if (net.role !== "host" || !net.peerOnline || net.syncTimer) return;
  net.syncTimer = setTimeout(netSyncNow, 30);
}
function netSyncNow() {
  clearTimeout(net.syncTimer); net.syncTimer = null;
  if (net.role !== "host" || !net.peerOnline || !state) return;
  netSend({ t: "relay", data: { t: "state", state, lastRoll, busy } });
}

/* ---------------- Boot ---------------- */
function migrate(s) {
  // Saves from before co-op had a single `hero`.
  if (s && s.hero && !s.heroes) {
    s.heroes = [Object.assign({ down: false, panel: s.panel || null, pendingLevels: s.pendingLevels || 0 }, s.hero)];
    delete s.hero; delete s.panel; delete s.pendingLevels;
  }
  if (s && s.combat && s.combat.turn === undefined) Object.assign(s.combat, { turn: 0, acted: [], luckUsed: {} });
  return s;
}
function start(data) {
  busy = false; actor = 0;
  const sess = netLoadSession();
  if (sess && sess.role && sess.token && roomServerUrl()) {
    Object.assign(net, { role: sess.role, code: sess.code, token: sess.token, name: sess.name || "", peerName: sess.peerName || "", guestJoined: !!sess.guestJoined, hello: { t: "resume", code: sess.code, token: sess.token } });
    state = sess.role === "host" ? migrate(sess.state) : null;
    render(); netOpen(); return;
  }
  const snap = data && data.state ? data.state : loadRun();
  state = snap && snap.screen && snap.screen !== "lobby" && !snap.coop ? migrate(snap) : { screen: "title" };
  if (data && data.lastRoll) lastRoll = data.lastRoll;
  render();
}
try { window.claude?.hot?.snapshot?.(() => ({ state, lastRoll })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
// test hook
window.__cc = { get state() { return state; }, newRun, moveTo, attack, useAbility, flee, drinkPotion, openChest, pray, rest, descend, equipLoot, sellLoot, choosePerk, buy, act, runAction, net, get busy() { return busy; } };
</script>
